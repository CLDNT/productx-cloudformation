AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cloudelligent WAFR Onboarding stack. Combines ProductX WAFR cross-account
  role with Cloudelligent assessment role (for Cloudviz), Billing read-only role,
  and ReservedAI role (for Archera). Set EnableOrganizations=yes to deploy all roles
  to member accounts via a service-managed StackSet.

Parameters:
  TrustedAccountId:
    Type: String
    Default: '820440428496'
    Description: ProductX platform AWS account ID permitted to assume this role.
  ExternalId:
    Type: String
    NoEcho: true
    Description: Per-account External ID issued by ProductX (confused-deputy protection). Do not change.
  EnableOrganizations:
    Type: String
    Default: 'no'
    AllowedValues: ['yes', 'no']
    Description: >-
      Set to 'yes' if this account is an AWS Organizations management account
      and you want ProductX to scan member accounts too. Requires CloudFormation
      StackSets trusted access to be activated in AWS Organizations first.
      Leave 'no' for single-account onboarding.
  ExistingCURBucket:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9.\-]{3,63}$'
    ConstraintDescription: >-
      Single S3 bucket name (DNS-compliant, 3-63 chars).
    Description: >-
      Name of the S3 bucket holding the CUR that ProductX should read.
      ProductX is read-only — it never creates buckets or CUR exports.
      Leave empty only if cost visibility is not needed yet (CUR can be
      connected later via the ProductX Cost Explorer UI).

Conditions:
  IsOrg: !Equals [!Ref EnableOrganizations, 'yes']
  HasExistingCURBucket: !Not [!Equals [!Ref ExistingCURBucket, '']]

Resources:
  # =============================================================
  # ProductX WAFR Role
  # =============================================================
  ProductXWAFRRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ProductXWAFRRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${TrustedAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: ComplianceSignalAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - config:DescribeComplianceByConfigRule
                  - config:GetComplianceDetailsByConfigRule
                  - config:DescribeConfigRules
                  - config:ListDiscoveredResources
                  - securityhub:GetFindings
                  - securityhub:DescribeHub
                  - access-analyzer:ListAnalyzers
                  - access-analyzer:ListFindings
                Resource: '*'
        - PolicyName: WAFRWorkloadManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WorkloadLifecycle
                Effect: Allow
                Action:
                  - wellarchitected:CreateWorkload
                  - wellarchitected:UpdateWorkload
                  - wellarchitected:DeleteWorkload
                Resource: '*'
              - Sid: WorkloadLensManagement
                Effect: Allow
                Action:
                  - wellarchitected:AssociateLenses
                  - wellarchitected:DisassociateLenses
                  - wellarchitected:UpgradeLensReview
                  - wellarchitected:UpdateLensReview
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
              - Sid: AnswerManagement
                Effect: Allow
                Action:
                  - wellarchitected:UpdateAnswer
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
              - Sid: MilestoneManagement
                Effect: Allow
                Action:
                  - wellarchitected:CreateMilestone
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
              - Sid: WorkloadReadAccess
                Effect: Allow
                Action:
                  - wellarchitected:GetWorkload
                  - wellarchitected:GetAnswer
                  - wellarchitected:GetLensReview
                  - wellarchitected:GetLensReviewReport
                  - wellarchitected:GetMilestone
                  - wellarchitected:GetLensVersionDifference
                  - wellarchitected:GetConsolidatedReport
                Resource: '*'
              - Sid: WorkloadListAccess
                Effect: Allow
                Action:
                  - wellarchitected:ListWorkloads
                  - wellarchitected:ListAnswers
                  - wellarchitected:ListLensReviews
                  - wellarchitected:ListLensReviewImprovements
                  - wellarchitected:ListMilestones
                  - wellarchitected:ListLenses
                  - wellarchitected:ListCheckDetails
                  - wellarchitected:ListCheckSummaries
                  - wellarchitected:ListNotifications
                Resource: '*'
              - Sid: WorkloadTagging
                Effect: Allow
                Action:
                  - wellarchitected:TagResource
                  - wellarchitected:UntagResource
                  - wellarchitected:ListTagsForResource
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
        - PolicyName: DataPlaneReadDeny
          # ProductX reads resource configuration/metadata, CloudWatch metrics,
          # Cost Explorer, and Cost & Usage Report (CUR) objects only. It never
          # reads customer application data. These explicit Denies override the
          # AWS ReadOnlyAccess managed policy to guarantee no object/item/message
          # content can be read outside the CUR bucket. Content-read actions
          # ONLY — never Describe/List/configuration Get actions.
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyCustomerDataPlaneReads
                Effect: Deny
                Action:
                  - s3-object-lambda:GetObject
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PartiQLSelect
                  - dax:GetItem
                  - dax:BatchGetItem
                  - dax:Query
                  - dax:Scan
                  - sqs:ReceiveMessage
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - sdb:Select
                  - sdb:GetAttributes
                  - cassandra:Select
                  - timestream:Select
                  - qldb:GetBlock
                  - qldb:GetRevision
                  - qldb:GetDigest
                Resource: '*'
              - Sid: DenyS3ObjectReadOutsideCUR
                Effect: Deny
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                NotResource:
                  - 'arn:aws:s3:::productx-cur-*/*'
                  - 'arn:aws:s3:::reserved-ai-cur-*/*'
                  - 'arn:aws:s3:::reserved-ai-spot-*/*'
                  - !If [HasExistingCURBucket, !Sub 'arn:aws:s3:::${ExistingCURBucket}/*', !Ref 'AWS::NoValue']


  # =============================================================
  # Compute Optimizer Policy (ProductX)
  # =============================================================
  ComputeOptimizerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ProductXComputeOptimizer
      Roles:
        - !Ref ProductXWAFRRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - compute-optimizer:DescribeRecommendationExportJobs
              - compute-optimizer:GetAutoScalingGroupRecommendations
              - compute-optimizer:GetEBSVolumeRecommendations
              - compute-optimizer:GetEC2InstanceRecommendations
              - compute-optimizer:GetEC2RecommendationProjectedMetrics
              - compute-optimizer:GetECSServiceRecommendationProjectedMetrics
              - compute-optimizer:GetECSServiceRecommendations
              - compute-optimizer:GetEffectiveRecommendationPreferences
              - compute-optimizer:GetEnrollmentStatus
              - compute-optimizer:GetEnrollmentStatusesForOrganization
              - compute-optimizer:GetIdleRecommendations
              - compute-optimizer:GetLambdaFunctionRecommendations
              - compute-optimizer:GetLicenseRecommendations
              - compute-optimizer:GetRDSDatabaseRecommendationProjectedMetrics
              - compute-optimizer:GetRDSDatabaseRecommendations
              - compute-optimizer:GetRecommendationPreferences
              - compute-optimizer:GetRecommendationSummaries
            Resource: '*'

  # =============================================================
  # Allow Assume Member Account Roles (org mode only)
  # =============================================================
  AllowAssumeMemberRoles:
    Type: AWS::IAM::Policy
    Condition: IsOrg
    Properties:
      PolicyName: ProductXWAFRAssumeMemberRoles
      Roles:
        - !Ref ProductXWAFRRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: 'arn:aws:iam::*:role/ProductXWAFRMemberRole'
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

  # =============================================================
  # CUR Management Policy (ProductX)
  # =============================================================
  ManageCURPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ProductXManageCUR
      Roles:
        - !Ref ProductXWAFRRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cur:DescribeReportDefinitions
            Resource: '*'
          - Effect: Allow
            Action:
              - cur:PutReportDefinition
              - cur:ModifyReportDefinition
              - cur:DeleteReportDefinition
            Resource: 'arn:aws:cur:*:*:definition/productx-*'
          - Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:HeadBucket
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
            Resource: 'arn:aws:s3:::productx-cur-*'
          - Effect: Allow
            Action:
              - s3:ListAllMyBuckets
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub 'arn:aws:s3:::productx-cur-${AWS::AccountId}'
              - !Sub 'arn:aws:s3:::productx-cur-${AWS::AccountId}/*'

  # =============================================================
  # CUR Read Policy (bring-your-own-CUR)
  # =============================================================
  ExistingCURBucketPolicy:
    Type: AWS::IAM::Policy
    Condition: HasExistingCURBucket
    Properties:
      PolicyName: ProductXReadExistingCURBucket
      Roles:
        - !Ref ProductXWAFRRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub 'arn:aws:s3:::${ExistingCURBucket}'
              - !Sub 'arn:aws:s3:::${ExistingCURBucket}/*'


  # =============================================================
  # Cloudviz Architecture Diagram Role
  # =============================================================
  CloudvizArchitectureDiagramRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "cloudelligent-assessment-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: "282762468439"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: "9ba55e7ffef3c1611a511bbbdadbcdbff662b8d9"
      Policies:
        - PolicyName: CloudvizReadOnlyAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:Describe*
                  - dynamodb:ListTables
                  - ses:List*
                  - dynamodb:ListTagsOfResource
                  - s3:List*
                  - s3:GetBucketTagging
                  - s3:GetBucketLocation
                  - rds:Describe*
                  - dynamodb:DescribeTable
                  - glacier:List*
                  - timestream:List*
                  - timestream:Describe*
                  - elasticache:List*
                  - route53:List*
                  - elasticloadbalancing:Describe*
                  - apigateway:GET
                  - ecs:List*
                  - cloudfront:List*
                  - ses:Get*
                  - sqs:ListQueues
                  - elasticfilesystem:Describe*
                  - sns:GetTopicAttributes
                  - lambda:List*
                  - lambda:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - ecs:Describe*
                  - sqs:GetQueueAttributes
                  - sqs:ListQueueTags
                  - elasticache:Describe*
                  - sns:List*
                  - ec2:Describe*
                  - rds:ListTagsForResource
                  - kafka:ListNodes
                  - kafka:ListClusters
                  - redshift:Describe*
                  - workspaces:Describe*
                  - es:Describe*
                  - es:List*
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - kinesis:List*
                  - kinesis:Describe*
                  - wafv2:ListWebACLs
                  - wafv2:ListResourcesForWebACL
                  - wafv2:ListTagsForResource
                  - ds:DescribeDirectories
                  - appsync:ListGraphqlApis
                  - appsync:ListDataSources
                Resource: '*'


  # =============================================================
  # Billing ReadOnly Role
  # =============================================================
  BillingReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BillingReadOnlyRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::898668804275:user/billingviewer'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BillingAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'aws-portal:ViewUsage'
                  - 'account:GetAccountInformation'
                  - 'aws-portal:ViewBilling'
                  - 'billing:GetBillingData'
                  - 'billing:GetBillingDetails'
                  - 'billing:GetBillingNotifications'
                  - 'billing:GetBillingPreferences'
                  - 'billing:GetCredits'
                  - 'billing:GetContractInformation'
                  - 'billing:GetIAMAccessPreference'
                  - 'billing:GetSellerOfRecord'
                  - 'billing:ListBillingViews'
                  - 'budgets:ViewBudget'
                  - 'budgets:DescribeBudgetActionsForBudget'
                  - 'budgets:DescribeBudgetAction'
                  - 'budgets:DescribeBudgetActionsForAccount'
                  - 'budgets:DescribeBudgetActionHistories'
                  - 'ce:DescribeCostCategoryDefinition'
                  - 'ce:GetCostAndUsage'
                  - 'ce:ListCostCategoryDefinitions'
                  - 'ce:ListTagsForResource'
                  - 'ce:ListCostAllocationTags'
                  - 'consolidatedbilling:ListLinkedAccounts'
                  - 'consolidatedbilling:GetAccountBillingRole'
                  - 'cur:GetClassicReport'
                  - 'cur:GetClassicReportPreferences'
                  - 'cur:GetUsageReport'
                  - 'cur:DescribeReportDefinitions'
                  - 'invoicing:GetInvoiceEmailDeliveryPreferences'
                  - 'invoicing:GetInvoicePDF'
                  - 'invoicing:ListInvoiceSummaries'
                  - 'payments:GetPaymentInstrument'
                  - 'payments:GetPaymentStatus'
                  - 'payments:ListPaymentPreferences'
                  - 'purchase-orders:GetPurchaseOrder'
                  - 'purchase-orders:ViewPurchaseOrders'
                  - 'purchase-orders:ListPurchaseOrderInvoices'
                  - 'purchase-orders:ListPurchaseOrders'
                  - 'purchase-orders:ListTagsForResource'
                  - 'support:DescribeTrustedAdvisorChecks'
                  - 'support:DescribeTrustedAdvisorCheckResult'
                  - 'support:DescribeTrustedAdvisorCheckSummaries'
                  - 'support:DescribeCases'
                  - 'support:DescribeCommunications'
                  - 'support:DescribeServices'
                  - 'support:DescribeSeverityLevels'
                  - 'support:DescribeIssueTypes'
                Resource: '*'


  # =============================================================
  # ReservedAI Role (Archera)
  # =============================================================
  ReservedAIRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ReservedAI-Write
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::967800896805:user/reserved-write
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: "8ab6faee-ffc1-4302-93a3-98daf7178208"
      Policies:
        - PolicyName: ReservedAI-Write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - 'ce:Get*'
                  - 'ce:Describe*'
                  - 'ce:List*'
                  - 'pricing:*'
                  - 'sts:GetCallerIdentity'
                  - 'servicequotas:GetServiceQuota'
                  - 'servicequotas:GetRequestedServiceQuotaChange'
                  - 'servicequotas:GetAWSDefaultServiceQuota'
                  - 'servicequotas:ListServices'
                  - 'servicequotas:ListServiceQuotas'
                  - 'servicequotas:ListRequestedServiceQuotaChangeHistoryByQuota'
                  - 'cloudtrail:LookupEvents'
                  - 'cur:DescribeReportDefinitions'
                  - 'ec2:DescribeAccountAttributes'
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeRegions'
                  - 'ec2:DescribeAvailabilityZones'
                  - 'ec2:DescribeSpotDatafeedSubscription'
                  - 'ec2:DescribeSpotFleetInstances'
                  - 'ec2:DescribeSpotFleetRequestHistory'
                  - 'ec2:DescribeSpotFleetRequests'
                  - 'ec2:DescribeSpotInstanceRequests'
                  - 'ec2:DescribeSpotPriceHistory'
                  - 'ec2:DescribeFleetHistory'
                  - 'ec2:DescribeFleetInstances'
                  - 'ec2:DescribeFleets'
                  - 'ec2:DescribeTags'
                  - 'tag:GetResources'
                  - 'resource-groups:GetGroupQuery'
                  - 'resource-groups:SearchResources'
                  - 'resource-groups:GetGroup'
                  - 'resource-groups:GetGroupConfiguration'
                  - 'resource-groups:GetTags'
                  - 'resource-groups:ListGroupResources'
                  - 'resource-groups:ListGroups'
                  - 'ec2:DescribeAddresses'
                  - 'ec2:DescribeMovingAddresses'
                  - 'ec2:DescribeVolumes'
                  - 'ec2:DescribeVolumesModifications'
                  - 'ec2:DescribeVolumeStatus'
                  - 'ec2:DescribeElasticGpus'
                  - 'ec2:DescribeScheduledInstances'
                  - 'ec2:DescribeScheduledInstanceAvailability'
                  - 'ec2:DescribeReservedInstances'
                  - 'ec2:DescribeReservedInstancesModifications'
                  - 'ec2:DescribeReservedInstancesListings'
                  - 'ec2:GetReservedInstancesExchangeQuote'
                  - 'ec2:DescribeReservedInstancesOfferings'
                  - 'ec2:DescribeCapacityReservations'
                  - 'ec2:DescribeHosts'
                  - 'ec2:DescribeHostReservations'
                  - 'ec2:GetHostReservationPurchasePreview'
                  - 'ec2:DescribeHostReservationOfferings'
                  - 'ec2:DescribeCapacityBlockOfferings'
                  - 'organizations:DescribeOrganization'
                  - 'organizations:ListAccounts'
                  - 'organizations:DescribeAccount'
                  - 'savingsplans:DescribeSavingsPlansOfferingRates'
                  - 'savingsplans:DescribeSavingsPlansOfferings'
                  - 'savingsplans:DescribeSavingsPlans'
                  - 'savingsplans:DescribeSavingsPlanRates'
                  - 'rds:DescribeReservedDBInstances'
                  - 'rds:DescribeReservedDBInstancesOfferings'
                  - 'redshift:DescribeReservedNodeOfferings'
                  - 'redshift:DescribeReservedNodes'
                  - 'dynamodb:DescribeReservedCapacity'
                  - 'dynamodb:DescribeReservedCapacityOfferings'
                  - 'elasticache:DescribeReservedCacheNodes'
                  - 'elasticache:DescribeReservedCacheNodesOfferings'
                  - 'memorydb:DescribeReservedNodes'
                  - 'memorydb:DescribeReservedNodesOfferings'
                  - 'es:DescribeReservedElasticsearchInstanceOfferings'
                  - 'es:DescribeReservedElasticsearchInstances'
                Resource:
                  - '*'
              - Effect: Allow
                Action:
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:SimulatePrincipalPolicy
                Resource:
                  - arn:aws:iam::*:role/ReservedAI-Write
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:ListBucket
                  - s3:PutBucketPolicy
                Resource:
                  - arn:aws:s3:::reserved-ai-cur-*
                  - arn:aws:s3:::reserved-ai-spot-*
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - arn:aws:s3:::reserved-ai-cur-*/*
                  - arn:aws:s3:::reserved-ai-spot-*/*
              - Effect: Allow
                Action:
                  - cur:PutReportDefinition
                Resource:
                  - arn:aws:cur:*:*:definition/reserved-ai-*


  # =================================================================
  # StackSet — deploys all member roles across the org
  # =================================================================
  CloudelligentOnboardingMemberStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: IsOrg
    Properties:
      StackSetName: CloudelligentOnboardingMemberStackSet
      Description: Deploys ProductX WAFR and Cloudviz roles to organization member accounts.
      PermissionModel: SERVICE_MANAGED
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_NAMED_IAM
      ManagedExecution:
        Active: true
      OperationPreferences:
        MaxConcurrentCount: 10
        FailureToleranceCount: 5
        RegionConcurrencyType: PARALLEL
      Parameters:
        - ParameterKey: ManagementAccountId
          ParameterValue: !Ref 'AWS::AccountId'
        - ParameterKey: ExternalId
          ParameterValue: !Ref ExternalId
      TemplateBody: |
        AWSTemplateFormatVersion: '2010-09-09'
        Description: Cloudelligent onboarding roles for member accounts (StackSet-deployed).

        Parameters:
          ManagementAccountId:
            Type: String
          ExternalId:
            Type: String
            NoEcho: true

        Resources:
          ProductXWAFRMemberRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: ProductXWAFRMemberRole
              AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: !Sub 'arn:aws:iam::${ManagementAccountId}:role/ProductXWAFRRole'
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        sts:ExternalId: !Ref ExternalId
              ManagedPolicyArns:
                - arn:aws:iam::aws:policy/SecurityAudit
                - arn:aws:iam::aws:policy/ReadOnlyAccess
              Policies:
                - PolicyName: ComplianceSignalAccess
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - config:DescribeComplianceByConfigRule
                          - config:GetComplianceDetailsByConfigRule
                          - config:DescribeConfigRules
                          - config:ListDiscoveredResources
                          - securityhub:GetFindings
                          - securityhub:DescribeHub
                          - access-analyzer:ListAnalyzers
                          - access-analyzer:ListFindings
                        Resource: '*'
                - PolicyName: ComputeOptimizerAccess
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - compute-optimizer:DescribeRecommendationExportJobs
                          - compute-optimizer:GetAutoScalingGroupRecommendations
                          - compute-optimizer:GetEBSVolumeRecommendations
                          - compute-optimizer:GetEC2InstanceRecommendations
                          - compute-optimizer:GetEC2RecommendationProjectedMetrics
                          - compute-optimizer:GetECSServiceRecommendationProjectedMetrics
                          - compute-optimizer:GetECSServiceRecommendations
                          - compute-optimizer:GetEffectiveRecommendationPreferences
                          - compute-optimizer:GetEnrollmentStatus
                          - compute-optimizer:GetIdleRecommendations
                          - compute-optimizer:GetLambdaFunctionRecommendations
                          - compute-optimizer:GetLicenseRecommendations
                          - compute-optimizer:GetRDSDatabaseRecommendationProjectedMetrics
                          - compute-optimizer:GetRDSDatabaseRecommendations
                          - compute-optimizer:GetRecommendationPreferences
                          - compute-optimizer:GetRecommendationSummaries
                        Resource: '*'
                - PolicyName: WAFRWorkloadManagement
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Sid: WorkloadLifecycle
                        Effect: Allow
                        Action:
                          - wellarchitected:CreateWorkload
                          - wellarchitected:UpdateWorkload
                          - wellarchitected:DeleteWorkload
                        Resource: '*'
                      - Sid: WorkloadLensManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:AssociateLenses
                          - wellarchitected:DisassociateLenses
                          - wellarchitected:UpgradeLensReview
                          - wellarchitected:UpdateLensReview
                        Resource: '*'
                      - Sid: AnswerManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:UpdateAnswer
                        Resource: '*'
                      - Sid: MilestoneManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:CreateMilestone
                        Resource: '*'
                      - Sid: WorkloadReadAccess
                        Effect: Allow
                        Action:
                          - wellarchitected:GetWorkload
                          - wellarchitected:GetAnswer
                          - wellarchitected:GetLensReview
                          - wellarchitected:GetLensReviewReport
                          - wellarchitected:GetMilestone
                          - wellarchitected:GetLensVersionDifference
                          - wellarchitected:GetConsolidatedReport
                        Resource: '*'
                      - Sid: WorkloadListAccess
                        Effect: Allow
                        Action:
                          - wellarchitected:ListWorkloads
                          - wellarchitected:ListAnswers
                          - wellarchitected:ListLensReviews
                          - wellarchitected:ListLensReviewImprovements
                          - wellarchitected:ListMilestones
                          - wellarchitected:ListLenses
                          - wellarchitected:ListCheckDetails
                          - wellarchitected:ListCheckSummaries
                          - wellarchitected:ListNotifications
                        Resource: '*'
                      - Sid: WorkloadTagging
                        Effect: Allow
                        Action:
                          - wellarchitected:TagResource
                          - wellarchitected:UntagResource
                          - wellarchitected:ListTagsForResource
                        Resource: '*'
                - PolicyName: DataPlaneReadDeny
                  # Explicit Denies override the AWS ReadOnlyAccess managed policy
                  # so the member role cannot read customer application data. Member
                  # accounts read CUR data only via prefix-scoped buckets. Content-read
                  # actions ONLY — never Describe/List/configuration Get actions.
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
